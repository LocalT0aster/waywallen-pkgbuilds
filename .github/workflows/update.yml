name: Update upstream releases

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: upstream-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-26.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: pacman -Sy --noconfirm && pacman -S --noconfirm --needed git github-cli pacman-contrib sudo
      - run: ./ci/checkout-repository.sh
      - name: Authorize the update checkout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
      - run: |
          ./ci/setup-build-user.sh
      - name: Update pinned submodules
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/update-upstreams.sh
      - run: su builder -c 'cd "$GITHUB_WORKSPACE" && ./scripts/update-pkgbuilds.sh'
      - name: Detect upstream package changes
        id: updates
        run: |
          if git diff --quiet -- .gitmodules upstream packages; then
            printf 'changed=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'changed=true\n' >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/build-test
        if: steps.updates.outputs.changed == 'true'
        with:
          checkout: 'false'
          diff-base: --working-tree
      - name: Commit validated release updates
        if: steps.updates.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .gitmodules upstream packages
          git diff --cached --quiet || git commit -m 'chore: update upstream package releases'
          git push origin HEAD:main
          gh workflow run "Validate packages" --ref main
