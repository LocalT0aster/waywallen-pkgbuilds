name: Publish pacman repository

on:
  workflow_run:
    workflows: [Validate packages]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Run that uploaded the validated-packages artifact.
        required: true
        type: string
      head_sha:
        description: Validated commit to publish.
        required: true
        type: string

permissions:
  actions: write
  contents: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-26.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.head_sha }}
      - run: pacman -Sy --noconfirm
      - run: pacman -S --noconfirm --needed git github-cli
      - name: Download current repository packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/x86_64
          if gh release view pacman-repository --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download pacman-repository --pattern '*.pkg.tar.zst' --dir dist/x86_64 --repo "$GITHUB_REPOSITORY"
          fi
      - name: Download validated packages
        uses: actions/download-artifact@v8
        with:
          name: validated-packages
          path: new-packages
          run-id: ${{ github.event.workflow_run.id || inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Merge validated packages
        run: |
          for package in new-packages/*.pkg.tar.zst; do
            set -- $(pacman -Qp "$package")
            name=$1
            for existing in dist/x86_64/*.pkg.tar.zst; do
              [[ -e $existing ]] || continue
              set -- $(pacman -Qp "$existing")
              [[ $1 == "$name" ]] && rm "$existing"
            done
            install -Dm644 "$package" dist/x86_64/"${package##*/}"
          done
      - name: Import package signing key
        env:
          PACKAGER_GPG_PRIVATE_KEY: ${{ secrets.PACKAGER_GPG_PRIVATE_KEY }}
        run: |
          printf '%s' "$PACKAGER_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --with-colons --list-secret-keys B075783531075AA59D4911C7448DCEC4307C77A0 | grep -q "^sec:"
      - name: Sign repository packages
        run: |
          for package in dist/x86_64/*.pkg.tar.zst; do
            gpg --batch --yes --detach-sign "$package"
          done
          repo-add dist/x86_64/waywallen.db.tar.zst dist/x86_64/*.pkg.tar.zst
          gpg --batch --yes --detach-sign dist/x86_64/waywallen.db.tar.zst
          ln -sf waywallen.db.tar.zst.sig dist/x86_64/waywallen.db.sig
      - name: Publish release-backed repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view pacman-repository --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create pacman-repository --repo "$GITHUB_REPOSITORY" --title 'Waywallen pacman repository' --notes 'Rolling signed pacman repository.' --latest=false
          gh release upload pacman-repository dist/x86_64/*.pkg.tar.zst dist/x86_64/*.pkg.tar.zst.sig --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload pacman-repository dist/x86_64/waywallen.db dist/x86_64/waywallen.db.sig dist/x86_64/waywallen.db.tar.zst dist/x86_64/waywallen.db.tar.zst.sig --clobber --repo "$GITHUB_REPOSITORY"
      - name: Delete consumed validation artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.source_run_id }}
        run: |
          artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "validated-packages") | .id')
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
